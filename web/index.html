<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星伴AI · 家长训练管理平台</title>
<script src="/echarts.min.js"></script>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0;
          --muted:#94a3b8; --accent:#38bdf8; --ok:#34d399; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:"Segoe UI",system-ui,sans-serif;
         padding:24px; min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  h1 { font-size:22px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card .k { color:var(--muted); font-size:13px; }
  .card .v { font-size:30px; font-weight:700; margin-top:6px; }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
  .chart { background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:14px; height:300px; }
  .wide { grid-column:1 / -1; }
  table { width:100%; border-collapse:collapse; background:var(--card);
          border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td { padding:10px 14px; text-align:left; font-size:13px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; background:#172033; }
  .tag { padding:2px 10px; border-radius:20px; font-size:12px; }
  .tag.ok { background:rgba(52,211,153,.15); color:var(--ok); }
  .tag.no { background:rgba(251,113,133,.15); color:#fb7185; }
  .advice { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent);
            border-radius:10px; padding:14px 18px; flex:1; min-width:200px; font-size:14px; }
  .advice .lv { font-size:12px; color:var(--muted); margin-top:6px; }
  .section-title { margin:20px 0 10px; font-size:16px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>星伴<span>AI</span> · 家长训练管理平台</h1>
      <div class="sub">基于计算机视觉的孤独症儿童家庭康复训练辅助系统 · 演示版</div>
    </div>
    <div class="sub" id="clock"></div>
  </header>

  <div class="grid">
    <div class="card"><div class="k">累计训练记录</div><div class="v" id="c-total">-</div></div>
    <div class="card"><div class="k">任务完成率</div><div class="v" id="c-rate">-</div></div>
    <div class="card"><div class="k">训练任务数</div><div class="v" id="c-tasks">-</div></div>
    <div class="card"><div class="k">提示依赖指数 PDI</div><div class="v" id="c-pdi">-</div></div>
    <div class="card"><div class="k">独立完成率</div><div class="v" id="c-indep">-</div></div>
    <div class="card"><div class="k">识别不确定比例</div><div class="v" id="c-unc">-</div></div>
  </div>

  <div class="charts">
    <div class="chart" id="chart-task"></div>
    <div class="chart" id="chart-category"></div>
    <div class="chart" id="chart-prompt"></div>
    <div class="chart" id="chart-scene"></div>
    <div class="chart wide" id="chart-trend"></div>
  </div>

  <div class="section-title">个体化辅助建议（创新点一：提示依赖感知的个体化辅助决策）</div>
  <div id="advice" style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;"></div>
  <div class="sub" style="margin:0 0 20px;">
    创新点一：提示依赖感知决策（PDI / 独立完成率 / 规则建议）· 创新点二：连续行为分析 + 不确定性评估（不确定比例）· 创新点三：跨家庭场景表现分析（场景对比图）
  </div>

  <div class="section-title">训练记录明细</div>
  <table>
    <thead><tr>
      <th>#</th><th>任务</th><th>开始</th><th>用时(秒)</th><th>状态</th><th>详情</th>
    </tr></thead>
    <tbody id="records"></tbody>
  </table>

<script>
const fmt = n => (n === null || n === undefined || isNaN(n)) ? '-' :
  (Math.round(n * 10) / 10).toString();

async function load() {
  await fetch('/api/sync');
  const [stats, tasks, records, decision] = await Promise.all([
    fetch('/api/stats').then(r => r.json()),
    fetch('/api/tasks').then(r => r.json()),
    fetch('/api/records').then(r => r.json()),
    fetch('/api/decision').then(r => r.json()),
  ]);

  // 1. 概览卡片
  document.getElementById('c-total').textContent = stats.total;
  document.getElementById('c-rate').textContent = (stats.completion_rate * 100).toFixed(0) + '%';
  document.getElementById('c-tasks').textContent = tasks.tasks.length;
  const all = records.records.filter(r => r.elapsed_sec > 0);
  const avg = all.length ? all.reduce((s, r) => s + r.elapsed_sec, 0) / all.length : 0;
  document.getElementById('c-avg').textContent = fmt(avg);

  // 2. 决策指标卡片
  document.getElementById('c-pdi').textContent = decision.pdi.toFixed(2);
  document.getElementById('c-indep').textContent = (decision.independent_rate * 100).toFixed(0) + '%';
  document.getElementById('c-unc').textContent = (decision.uncertainty_ratio * 100).toFixed(0) + '%';

  // 3. 建议面板
  document.getElementById('advice').innerHTML = decision.suggestions.map(a =>
    `<div class="advice">${a.text}<div class="lv">PDI ${a.pdi} · 独立完成率 ${(a.independent_rate*100).toFixed(0)}% · 完成率 ${(a.completion_rate*100).toFixed(0)}%</div></div>`
  ).join('');

  // 4. 明细表（先渲染，不受图表影响）
  document.getElementById('records').innerHTML = records.records.map((r, i) => {
    const ok = (r.status || '').includes('完成');
    let detail = '-';
    try { detail = JSON.parse(r.detail || '{}'); detail = detail['完成步骤'] || detail['备注'] || '-'; } catch(e){}
    return `<tr><td>${i + 1}</td><td>${r.task_name || '-'}</td><td>${r.start_time || r.created_at || '-'}</td>
      <td>${fmt(r.elapsed_sec)}</td>
      <td><span class="tag ${ok ? 'ok' : 'no'}">${r.status || '-'}</span></td>
      <td>${detail}</td></tr>`;
  }).join('');

  // 5. 图表（每个独立 try/catch，失败不影响其它内容）
  const taskNames = stats.by_task.map(t => t.name || '未命名');
  const taskDone = stats.by_task.map(t => t.done);
  const taskMiss = stats.by_task.map(t => t.count - t.done);
  const pie = stats.by_category.map(c => ({ name: c.category || '未分类', value: c.count }));
  const days = stats.trend.map(t => t.day);
  const counts = stats.trend.map(t => t.count);
  const scenes = decision.scene_breakdown.map(s => s.scene);
  const scDone = decision.scene_breakdown.map(s => s.done);
  const scMiss = decision.scene_breakdown.map(s => s.count - s.done);

  safeChart('chart-task', ch => barOpt(ch, '各任务完成情况', taskNames, taskDone, taskMiss));
  safeChart('chart-category', ch => ch.setOption({
    title: { text: '任务分类分布', left: 'center', textStyle: { color: '#e2e8f0', fontSize: 14 } },
    tooltip: { trigger: 'item' },
    series: [{ type: 'pie', radius: ['40%', '65%'], data: pie, label: { color: '#e2e8f0' } }]
  }));
  safeChart('chart-trend', ch => ch.setOption({
    title: { text: '训练次数趋势', left: 'center', textStyle: { color: '#e2e8f0', fontSize: 14 } },
    tooltip: { trigger: 'axis' }, grid: { left: 40, right: 20, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: days, axisLabel: { color: '#94a3b8' } },
    yAxis: { type: 'value', axisLabel: { color: '#94a3b8' } },
    series: [{ type: 'line', data: counts, smooth: true, areaStyle: { opacity: .2 }, itemStyle: { color: '#38bdf8' } }]
  }));
  safeChart('chart-prompt', ch => ch.setOption({
    title: { text: '提示等级分布（创新点一）', left: 'center', textStyle: { color: '#e2e8f0', fontSize: 14 } },
    tooltip: { trigger: 'axis' }, grid: { left: 40, right: 20, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: decision.prompt_labels, axisLabel: { color: '#94a3b8' } },
    yAxis: { type: 'value', axisLabel: { color: '#94a3b8' } },
    series: [{ type: 'bar', data: decision.prompt_distribution, itemStyle: { color: '#38bdf8' } }]
  }));
  safeChart('chart-scene', ch => barOpt(ch, '各场景完成情况（创新点三）', scenes, scDone, scMiss));
}

function safeChart(id, build) {
  try { build(echarts.init(document.getElementById(id))); }
  catch (e) { console.warn('图表渲染失败', id, e); }
}
function barOpt(ch, title, names, done, miss) {
  ch.setOption({
    title: { text: title, left: 'center', textStyle: { color: '#e2e8f0', fontSize: 14 } },
    tooltip: { trigger: 'axis' }, legend: { data: ['完成', '未完成'], textStyle: { color: '#94a3b8' } },
    grid: { left: 40, right: 20, top: 50, bottom: 30 },
    xAxis: { type: 'category', data: names, axisLabel: { color: '#94a3b8', rotate: 20 } },
    yAxis: { type: 'value', axisLabel: { color: '#94a3b8' } },
    series: [
      { name: '完成', type: 'bar', stack: 'a', data: done, itemStyle: { color: '#34d399' } },
      { name: '未完成', type: 'bar', stack: 'a', data: miss, itemStyle: { color: '#fb7185' } }
    ]
  });
}
function tick() {
  document.getElementById('clock').textContent = new Date().toLocaleString('zh-CN');
}
tick(); setInterval(tick, 1000);
load();
// 自动同步：每 5 秒重新同步并刷新一次，无需手动操作
setInterval(load, 5000);
</script>
</body>
</html>
